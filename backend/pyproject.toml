[tool.poetry]
name = "law-rag-backend"
version = "0.1.0"
description = "Legal document RAG system backend"
authors = ["Law RAG Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
llama-index = "^0.10.0"
llama-index-llms-openai = "^0.1.0"
llama-index-embeddings-openai = "^0.1.0"
llama-index-vector-stores-qdrant = "^0.2.0"
qdrant-client = "^1.9.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"
aiosqlite = "^0.20.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
bcrypt = ">=3.1.0,<4.0"
email-validator = "^2.1.0"
pydantic-settings = "^2.2.0"
pdfplumber = "^0.11.0"
pymupdf = "^1.24.0"
python-docx = "^1.1.0"
pytesseract = "^0.3.10"
rank-bm25 = "^0.2.2"
sentence-transformers = "^2.7.0"
python-multipart = "^0.0.9"
watchdog = "^4.0.0"
pydantic = "^2.6.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.26.0"
ruff = "^0.1.0"
black = "^23.12.0"
mypy = "^1.7.0"
types-python-jose = "^3.3.0"
types-passlib = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["qdrant_client.*", "llama_index.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = ["asyncio: marks tests as async (deselect with '-m \"not asyncio\"')"]
