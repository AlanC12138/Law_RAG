[tool.poetry]
name = "law-rag-backend"
version = "0.2.0"
description = "Legal document RAG system backend"
authors = ["Law RAG Team"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
openai = "^1.30.0"
qdrant-client = "^1.9.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
aiosqlite = "^0.20.0"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
bcrypt = ">=3.1.0,<4.0"
email-validator = "^2.1.0"
pydantic-settings = "^2.2.0"
pdfplumber = "^0.11.0"
python-docx = "^1.1.0"
pytesseract = "^0.3.10"
rank-bm25 = "^0.2.2"
sentence-transformers = "^2.7.0"
python-multipart = "^0.0.9"
python-dotenv = "^1.0.0"
watchdog = "^4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"
ruff = "^0.4.0"
black = "^24.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = ["asyncio: marks tests as async (deselect with '-m \"not asyncio\"')"]
