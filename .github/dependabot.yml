version: 2

# Updates open against `dev`, not the default branch: `dev` is the integration
# branch here and is what CI gates, so dependency bumps flow through the same
# path as every other change rather than landing straight on `main`.
#
# Monthly, grouped, and semver-majors ignored. Majors are the ones that need a
# human reading release notes, and an auto-opened major PR mostly sits there
# going stale — bump those deliberately instead.
updates:
  # ── Backend (Poetry) ──────────────────────────────────────────────────────
  # The `pip` ecosystem covers Poetry projects: Dependabot reads
  # backend/pyproject.toml and updates backend/poetry.lock.
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend:
        patterns:
          - "*"

  # ── Frontend (npm) ────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned to 0.4.x: 0.5.0 requires eslint ^9 || ^10 and this project is
      # on eslint ^8, so the bump fails `npm install` outright with ERESOLVE
      # and takes the whole grouped PR down with it. Dependabot classifies a
      # 0.x minor as "minor", so the semver-major rule above does not catch
      # it. Lift this when eslint is migrated to 9 (needs flat config).
      - dependency-name: "eslint-plugin-react-refresh"
        update-types: ["version-update:semver-minor"]
    groups:
      frontend:
        patterns:
          - "*"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # Keeps actions/checkout, setup-python, setup-node, cache and
  # snok/install-poetry on current majors so runs stop emitting deprecation
  # annotations.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
