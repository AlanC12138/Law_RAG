name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the situation you are stuck in, not the solution you have in
        mind. "I can't tell which matter a document belongs to when…" is more
        useful than "add a dropdown".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional — a sketch of how it might work.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Retrieval quality / answer accuracy
        - Document ingestion
        - Matters, users, access control
        - Frontend / UX
        - Deployment, configuration, ops
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        Related issues, prior art in other tools, or constraints worth knowing
        (for example: must work air-gapped with Ollama).
    validations:
      required: false
