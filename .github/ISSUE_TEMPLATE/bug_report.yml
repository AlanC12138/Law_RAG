name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** use this form for security vulnerabilities — see
        [SECURITY.md](../SECURITY.md) for private reporting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        1. Uploaded a 60 MB PDF to a matter
        2. Expected a clear "too large" error
        3. Got a generic 500 instead
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend — API / auth
        - Backend — ingestion (PDF, DOCX, OCR, chunking)
        - Backend — retrieval (BM25, vectors, reranking, LLM)
        - Backend — database / migrations
        - Frontend — UI
        - Docker / setup
        - CI
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: how-running
    attributes:
      label: How are you running it?
      options:
        - docker compose (default — Postgres + Qdrant)
        - Backend directly, SQLite fallback
        - Other / modified setup
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "`git rev-parse --short HEAD`, or the release tag."
      placeholder: "v0.3.0 or 5b01c8f"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        From `docker compose logs backend` or the browser console.
        **Redact your API keys and any document contents** before pasting.
      render: shell
    validations:
      required: false
