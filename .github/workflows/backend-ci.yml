name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Least privilege: nothing here writes to the repo. Grant write per-job in
# YAML if a future job ever needs it — never repo-wide in settings.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff & Black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"
          virtualenvs-in-project: true

      - name: Cache venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          # Hash pyproject.toml as well as the lock file: if poetry.lock is
          # ever missing, hashFiles() returns "" and the key would otherwise
          # be constant — silently pinning CI to a stale venv forever, since
          # the install step below is skipped on a cache hit.
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        # --no-root matches the Dockerfile: the app runs from the source tree
        # (pytest picks it up via backend/conftest.py), it is never installed
        # as a package. Without this, poetry builds the root project and fails
        # on `readme = "README.md"`, which does not exist in backend/.
        run: cd backend && poetry install --with dev --no-root

      - name: Run Ruff
        run: cd backend && poetry run ruff check .

      - name: Run Black
        run: cd backend && poetry run black --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"
          virtualenvs-in-project: true

      - name: Cache venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          # Hash pyproject.toml as well as the lock file: if poetry.lock is
          # ever missing, hashFiles() returns "" and the key would otherwise
          # be constant — silently pinning CI to a stale venv forever, since
          # the install step below is skipped on a cache hit.
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        # --no-root matches the Dockerfile: the app runs from the source tree
        # (pytest picks it up via backend/conftest.py), it is never installed
        # as a package. Without this, poetry builds the root project and fails
        # on `readme = "README.md"`, which does not exist in backend/.
        run: cd backend && poetry install --with dev --no-root

      - name: Run tests
        env:
          OPENAI_API_KEY: sk-test-placeholder
          SECRET_KEY: "test-secret-key-for-ci-at-least-32-chars!!"
          # Must be quoted — a plain YAML scalar cannot end in ':', so the
          # unquoted form made this whole workflow file unparseable.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          QDRANT_PATH: /tmp/qdrant_test
          APP_ENV: test
        run: cd backend && poetry run pytest --asyncio-mode=auto -v

  migrate:
    name: Migrate (Alembic against Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: law_rag
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: law_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U law_rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"
          virtualenvs-in-project: true

      - name: Cache venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          # Hash pyproject.toml as well as the lock file: if poetry.lock is
          # ever missing, hashFiles() returns "" and the key would otherwise
          # be constant — silently pinning CI to a stale venv forever, since
          # the install step below is skipped on a cache hit.
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('backend/poetry.lock', 'backend/pyproject.toml') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        # --no-root matches the Dockerfile: the app runs from the source tree
        # (pytest picks it up via backend/conftest.py), it is never installed
        # as a package. Without this, poetry builds the root project and fails
        # on `readme = "README.md"`, which does not exist in backend/.
        run: cd backend && poetry install --with dev --no-root

      # SECRET_KEY is a required Settings field with no default, and
      # alembic/env.py calls get_settings() at import — without it the
      # migration fails with a pydantic ValidationError before touching
      # the database. (backend/.env supplies it locally, but that file is
      # gitignored and therefore absent in CI.)
      - name: Run alembic upgrade head against a real Postgres
        env:
          DATABASE_URL: "postgresql+asyncpg://law_rag:ci-test-password@localhost:5432/law_rag"
          SECRET_KEY: "test-secret-key-for-ci-at-least-32-chars!!"
        run: cd backend && poetry run alembic upgrade head

      # Schema drift: a model changed without a matching migration passes the
      # test suite (which builds its own tables from the models) and only
      # breaks on deploy. `alembic check` autogenerates against the migrated
      # database and fails if it finds operations still to apply.
      - name: Check for model/migration drift
        env:
          DATABASE_URL: "postgresql+asyncpg://law_rag:ci-test-password@localhost:5432/law_rag"
          SECRET_KEY: "test-secret-key-for-ci-at-least-32-chars!!"
        run: cd backend && poetry run alembic check

      - name: Verify every model table was created
        env:
          DATABASE_URL: "postgresql+asyncpg://law_rag:ci-test-password@localhost:5432/law_rag"
          SECRET_KEY: "test-secret-key-for-ci-at-least-32-chars!!"
        run: |
          cd backend && poetry run python -c "
          import asyncio
          from sqlalchemy import inspect
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.db.base import Base
          from app.db import models  # noqa: F401

          async def main():
              engine = create_async_engine('postgresql+asyncpg://law_rag:ci-test-password@localhost:5432/law_rag')
              async with engine.connect() as conn:
                  tables = await conn.run_sync(lambda sync_conn: inspect(sync_conn).get_table_names())
              await engine.dispose()
              expected = set(Base.metadata.tables.keys())
              missing = expected - set(tables)
              assert not missing, f'Migration did not create: {missing}'
              print(f'All {len(expected)} tables present after migration: {sorted(expected)}')

          asyncio.run(main())
          "
